name: CI

on: [push, pull_request_target, workflow_dispatch]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup node & pnpm
        uses: pnpm/setup@v1
        with:
          working-directory: source
          cache: true
        
      - name: Install dependencies
        working-directory: source
        run: |
          pnpm install --frozen-lockfile

      - name: Run lint
        working-directory: source
        run: |
          pnpm run lint
      
      - name: Test build
        working-directory: source
        run: |
          pnpm run build